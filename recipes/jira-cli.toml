name = "Jira CLI"
category = "tool"
description = "`jira` (ankitpokhrel/jira-cli) for Jira Cloud; allow your site with a `jira` secret that sets JIRA_API_TOKEN"
icon = "jira.svg"
icon_color = "#0052CC"
os = ["debian", "ubuntu"]
install_allow = ["@packages", "github.com", "*.githubusercontent.com"]
allow = ["*.atlassian.net", "api.atlassian.com"]
secrets = ["jira"]
install = '''
# Release binary from GitHub. Log in with `jira init` or set JIRA_API_TOKEN (and JIRA_AUTH_TYPE=basic).
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl
case "$(dpkg --print-architecture)" in
  amd64) arch=x86_64 ;;
  arm64) arch=arm64 ;;
  *) echo "unsupported architecture" >&2; exit 1 ;;
esac
tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/ankitpokhrel/jira-cli/releases/latest)
tag=${tag##*/}
curl -fsSL "https://github.com/ankitpokhrel/jira-cli/releases/download/$tag/jira_${tag#v}_linux_${arch}.tar.gz" -o /tmp/jira.tar.gz
mkdir -p /tmp/jira-cli
tar -xzf /tmp/jira.tar.gz -C /tmp/jira-cli
sudo install -m 0755 "$(find /tmp/jira-cli -name jira -type f | head -n 1)" /usr/local/bin/jira
rm -rf /tmp/jira.tar.gz /tmp/jira-cli
jira version
'''

[[credential]]
name = "jira"
label = "Jira API token"
help = "Jira Cloud: an Atlassian API token (Authentication basic, the default). Jira Data Center: a personal access token (Authentication bearer). The site and your login are set with 'Set up Jira' below."
url = "https://id.atlassian.com/manage-profile/security/api-tokens"
hosts = ["*.atlassian.net", "api.atlassian.com"]
env = ["JIRA_API_TOKEN"]

[[config]]
env = "JIRA_AUTH_TYPE"
label = "Authentication"
help = "basic (the default) sends login and token; bearer sends a personal access token; mtls uses client certificates."
kind = "choice"
options = ["basic", "bearer", "mtls"]
placeholder = "basic"

# A first setup from the Config tab: writes ~/.config/.jira/.config.yml.
[[action]]
label = "Set up Jira"
help = "Writes the Jira CLI's configuration: your site, your account, a default project and its board. Store the token first; the setup signs in with it."
command = "jira init --installation {installation} --server {server} --login {login} --auth-type {auth} --project {project} --board {board} --force"

[[action.input]]
name = "server"
label = "Site"
placeholder = "https://example.atlassian.net"

[[action.input]]
name = "login"
label = "Account e-mail or user name"
placeholder = "me@example.com"

[[action.input]]
name = "project"
label = "Default project key"
placeholder = "ABC"

[[action.input]]
name = "board"
label = "Board of that project"
placeholder = "ABC board"

[[action.input]]
name = "installation"
label = "cloud or local"
default = "cloud"

[[action.input]]
name = "auth"
label = "basic, bearer or mtls"
default = "basic"
