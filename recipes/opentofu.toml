name = "OpenTofu"
category = "tool"
description = "OpenTofu (`tofu`) from the OpenTofu project's apt repository"
icon = "opentofu.svg"
icon_color = "#FFDA18"
os = ["debian", "ubuntu"]
install_allow = ["@packages", "get.opentofu.org", "packages.opentofu.org", "d3fo0g5hm7lbuv.cloudfront.net"]
# The registry; provider archives are fetched from the hosts it points to (mostly GitHub releases).
allow = ["registry.opentofu.org", "github.com", "release-assets.githubusercontent.com"]
install = '''
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends apt-transport-https ca-certificates curl gnupg
sudo install -m 0755 -d /etc/apt/keyrings
curl -fsSL https://get.opentofu.org/opentofu.gpg | sudo tee /etc/apt/keyrings/opentofu.gpg >/dev/null
curl -fsSL https://packages.opentofu.org/opentofu/tofu/gpgkey | sudo gpg --no-tty --batch --yes --dearmor -o /etc/apt/keyrings/opentofu-repo.gpg
sudo chmod a+r /etc/apt/keyrings/opentofu.gpg /etc/apt/keyrings/opentofu-repo.gpg
echo "deb [signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main" | sudo tee /etc/apt/sources.list.d/opentofu.list >/dev/null
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tofu
tofu version | head -n1
'''

[[config]]
env = "TF_LOG"
label = "Log level"
help = "How much the log shows."
kind = "choice"
options = ["TRACE", "DEBUG", "INFO", "WARN", "ERROR", "OFF"]

[[config]]
env = "TF_LOG_PATH"
label = "Log file"
help = "File that the log is written to."

[[config]]
env = "TF_INPUT"
label = "No prompts"
help = "Never ask for input."
kind = "switch"
on = "0"

[[config]]
env = "TF_WORKSPACE"
label = "Workspace"
help = "Workspace to use."
placeholder = "default"

[[config]]
env = "TF_PLUGIN_CACHE_DIR"
label = "Provider cache"
help = "Folder where downloaded providers are shared."
