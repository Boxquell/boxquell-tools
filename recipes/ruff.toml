name = "Ruff"
category = "tool"
description = "Ruff (`ruff`), a fast Python linter and formatter"
icon = "ruff.svg"
icon_color = "#D7FF64"
os = ["debian", "ubuntu"]
install_allow = ["@packages", "astral.sh", "*.astral.sh", "github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"]
install = '''
# The official installer, which picks the release binary for this CPU.
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl
curl -LsSf https://astral.sh/ruff/install.sh | sudo env RUFF_UNMANAGED_INSTALL=/usr/local/bin sh
ruff --version
'''

[[config]]
env = "RUFF_OUTPUT_FORMAT"
label = "Output format"
help = "How ruff check prints its findings."
kind = "choice"
options = ["full", "concise", "json", "json-lines", "junit", "grouped", "github", "gitlab", "pylint", "rdjson", "azure", "sarif"]
placeholder = "full"

[[config]]
env = "RUFF_NO_CACHE"
label = "No cache"
help = "Do not read the cache."
kind = "switch"
on = "true"

[[config]]
env = "RUFF_CACHE_DIR"
label = "Cache folder"
help = "Where ruff keeps its cache."
placeholder = ".ruff_cache"
