name = "Vercel CLI"
category = "tool"
description = "`vercel` for deploying to Vercel (installs Node.js); set a `vercel` secret on VERCEL_TOKEN to log in"
icon = "vercel.svg"
icon_color = "#000000"
os = ["debian", "ubuntu"]
requires = ["node"]
install_allow = ["registry.npmjs.org"]
allow = ["api.vercel.com"]
secrets = ["vercel"]
install = '''
# Installed with npm into /usr/local. Authenticate with VERCEL_TOKEN or `vercel login`.
sudo npm install -g vercel
vercel --version | tail -n1
'''

[[credential]]
name = "vercel"
label = "Vercel access token"
help = "An access token for your account or team."
url = "https://vercel.com/account/settings/tokens"
hosts = ["api.vercel.com"]
env = ["VERCEL_TOKEN"]

[[config]]
env = "VERCEL_ORG_ID"
label = "Team ID"
help = "Team that the project belongs to, without running vercel link."

[[config]]
env = "VERCEL_PROJECT_ID"
label = "Project ID"
help = "Project that the CLI works on, without running vercel link."
