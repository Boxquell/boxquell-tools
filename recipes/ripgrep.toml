name = "ripgrep"
category = "tool"
description = "Fast recursive search (`rg`)"
icon = "ripgrep.svg"
icon_color = "#5E5CE6"
os = ["debian", "ubuntu"]
install_allow = ["@packages"]
install = '''
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ripgrep
rg --version | head -n1
'''
