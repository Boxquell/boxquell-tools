name = "Git"
category = "tool"
description = "git with Git LFS from Debian"
icon = "git.svg"
icon_color = "#F03C2E"
os = ["debian", "ubuntu"]
install_allow = ["@packages"]
install = '''
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends git git-lfs
git --version
'''
