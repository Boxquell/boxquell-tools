name = "Git"
category = "tool"
description = "git with Git LFS from Debian"
icon = "git.svg"
icon_color = "#F03C2E"
os = ["debian", "ubuntu"]
install_allow = ["@packages"]
install = '''
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends git git-lfs
git --version
'''

[[config]]
env = "GIT_AUTHOR_NAME"
label = "Author name"
help = "Name recorded as the author of commits."

[[config]]
env = "GIT_AUTHOR_EMAIL"
label = "Author email"
help = "Email recorded as the author of commits."

[[config]]
env = "GIT_COMMITTER_NAME"
label = "Committer name"
help = "Name recorded as the committer of commits."

[[config]]
env = "GIT_COMMITTER_EMAIL"
label = "Committer email"
help = "Email recorded as the committer of commits."
