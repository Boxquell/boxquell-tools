name = "Confluence CLI"
category = "tool"
description = "`confluence` (pchuri/confluence-cli) for Confluence Cloud; allow your site with a `confluence` secret that sets CONFLUENCE_API_TOKEN"
icon = "confluence.svg"
icon_color = "#172B4D"
os = ["debian", "ubuntu"]
requires = ["node"]
install_allow = ["registry.npmjs.org"]
allow = ["*.atlassian.net", "api.atlassian.com"]
secrets = ["confluence"]
install = '''
# Installed with npm; set CONFLUENCE_DOMAIN, CONFLUENCE_EMAIL and CONFLUENCE_API_TOKEN, or run `confluence init`.
sudo npm install -g confluence-cli
confluence --version
'''

[[credential]]
name = "confluence"
label = "Confluence API token"
help = "An API token; without an email on the Config tab it is sent as a bearer token."
url = "https://id.atlassian.com/manage-profile/security/api-tokens"
hosts = ["*.atlassian.net", "api.atlassian.com"]
env = ["CONFLUENCE_API_TOKEN"]

[[config]]
env = "CONFLUENCE_DOMAIN"
label = "Site"
help = "Host of your Confluence site."
placeholder = "your-site.atlassian.net"

[[config]]
env = "CONFLUENCE_EMAIL"
label = "Email"
help = "Account email for basic authentication."

[[config]]
env = "CONFLUENCE_AUTH_TYPE"
label = "Authentication"
help = "Basic with an email, bearer for self-hosted sites."
kind = "choice"
options = ["basic", "bearer"]
