name = "Netlify CLI"
category = "tool"
description = "`netlify` for deploying to Netlify (installs Node.js); set a `netlify` secret on NETLIFY_AUTH_TOKEN to log in"
icon = "netlify.svg"
icon_color = "#000000"
os = ["debian", "ubuntu"]
requires = ["node"]
install_allow = ["registry.npmjs.org"]
allow = ["api.netlify.com"]
secrets = ["netlify"]
install = '''
# Installed with npm into /usr/local. Authenticate with NETLIFY_AUTH_TOKEN or `netlify login`.
sudo npm install -g netlify-cli
netlify --version
'''

[[credential]]
name = "netlify"
label = "Netlify access token"
help = "A personal access token."
url = "https://app.netlify.com/user/applications#personal-access-tokens"
hosts = ["api.netlify.com"]
env = ["NETLIFY_AUTH_TOKEN"]

[[config]]
env = "NETLIFY_SITE_ID"
label = "Site ID"
help = "Site that the CLI works on, without running netlify link."

[[config]]
env = "DEBUG"
label = "Debug output"
help = "Print full debug output."
options = ["*"]
