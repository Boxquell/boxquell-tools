name = "bat"
category = "tool"
description = "A cat clone with syntax highlighting (`bat`)"
icon = "bat.svg"
icon_color = "#5E5CE6"
os = ["debian", "ubuntu"]
install_allow = ["@packages"]
install = '''
# Debian names the binary batcat; link it as bat.
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends bat
sudo ln -sf "$(command -v batcat)" /usr/local/bin/bat
bat --version
'''

[[config]]
env = "BAT_THEME"
label = "Theme"
help = "Color theme for syntax highlighting."
options = ["ansi", "base16", "GitHub", "Nord", "OneHalfDark", "Dracula", "Solarized (dark)"]

[[config]]
env = "BAT_STYLE"
label = "Style"
help = "Which decorations bat shows."
options = ["full", "plain", "numbers", "changes", "header,grid"]
placeholder = "full"
