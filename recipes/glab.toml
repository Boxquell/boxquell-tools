name = "GitLab CLI"
category = "tool"
description = "`glab`, with gitlab.com allowed for git and the API (set GITLAB_TOKEN with a `gitlab` secret)"
icon = "gitlab.svg"
icon_color = "#FC6D26"
os = ["debian", "ubuntu"]
install_allow = ["@packages", "gitlab.com", "*.gitlab.com", "*.googleapis.com"]
allow = ["gitlab.com"]
secrets = ["gitlab"]
install = '''
# Official release binary from the glab project; the system package is older.
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl git
arch=$(dpkg --print-architecture)
tag=$(curl -fsSL https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest | sed -n 's/.*"tag_name":"\([^"]*\)".*/\1/p')
curl -fsSL "https://gitlab.com/gitlab-org/cli/-/releases/$tag/downloads/glab_${tag#v}_linux_${arch}.tar.gz" -o /tmp/glab.tar.gz
tar -xzf /tmp/glab.tar.gz -C /tmp bin/glab
sudo install -m 0755 /tmp/bin/glab /usr/local/bin/glab
rm -rf /tmp/glab.tar.gz /tmp/bin
glab --version
'''

[env]
GITLAB_HOST = "gitlab.com"

[[credential]]
name = "gitlab"
label = "GitLab access token"
help = "A personal access token with the api scope."
url = "https://gitlab.com/-/user_settings/personal_access_tokens"
hosts = ["gitlab.com"]
env = ["GITLAB_TOKEN"]

[[config]]
env = "GITLAB_HOST"
label = "GitLab host"
help = "The GitLab hostname to use, for a self-managed instance."
placeholder = "gitlab.com"

[[config]]
env = "NO_PROMPT"
label = "No prompts"
help = "Never ask interactive questions."
kind = "switch"
on = "true"

[[config]]
env = "GLAB_PAGER"
label = "Pager"
help = "Program that pages long output."
placeholder = "less -R"

[[config]]
env = "GLAB_GLAMOUR_STYLE"
label = "Markdown style"
help = "Color style for rendered Markdown."
kind = "choice"
options = ["auto", "dark", "light", "notty"]
placeholder = "auto"

[[config]]
env = "GLAB_SEND_TELEMETRY"
label = "Usage data"
help = "Whether usage data is sent to your GitLab instance."
kind = "choice"
options = ["true", "false"]
placeholder = "true"
