name = "Sentry CLI"
category = "tool"
description = "`sentry-cli` for releases and source maps; set a `sentry` secret on SENTRY_AUTH_TOKEN to log in"
icon = "sentry.svg"
icon_color = "#362D59"
os = ["debian", "ubuntu"]
install_allow = ["@packages", "sentry.io", "downloads.sentry-cdn.com", "release-registry.services.sentry.io", "github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"]
allow = ["sentry.io"]
secrets = ["sentry"]
install = '''
# The official install script, with the binary placed in /usr/local/bin.
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl
curl -fsSL https://sentry.io/get-cli/ | sudo env INSTALL_DIR=/usr/local/bin sh
sentry-cli --version
'''

[[credential]]
name = "sentry"
label = "Sentry auth token"
help = "An organization token (fixed permissions, meant for CI and sentry-cli) or a personal token, created on sentry.io."
url = "https://sentry.io/settings/account/api/auth-tokens/"
hosts = ["sentry.io"]
env = ["SENTRY_AUTH_TOKEN"]

[[config]]
env = "SENTRY_ORG"
label = "Organization"
help = "Organization slug that commands use."

[[config]]
env = "SENTRY_PROJECT"
label = "Project"
help = "Project slug that commands use."

[[config]]
env = "SENTRY_URL"
label = "Sentry URL"
help = "Address of the Sentry server, for a self-hosted one."
placeholder = "https://sentry.io"

[[config]]
env = "SENTRY_LOG_LEVEL"
label = "Log level"
help = "How much the CLI logs."
kind = "choice"
options = ["trace", "debug", "info", "warn", "error"]
placeholder = "warn"
