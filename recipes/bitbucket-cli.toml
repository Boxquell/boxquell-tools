name = "Bitbucket CLI"
category = "tool"
description = "`bkt` (avivsinai/bitbucket-cli) for Bitbucket Cloud; allow your workspace with a `bitbucket` secret that sets BKT_TOKEN"
icon = "bitbucket.svg"
icon_color = "#0052CC"
os = ["debian", "ubuntu"]
install_allow = ["@packages", "github.com", "*.githubusercontent.com"]
allow = ["bitbucket.org", "*.bitbucket.org", "api.bitbucket.org"]
secrets = ["bitbucket"]
install = '''
# Release binary from GitHub. Log in with `bkt auth login https://bitbucket.org --kind cloud --web-token`, or set
# BKT_TOKEN and BKT_USERNAME (an Atlassian API token and its email); BKT_HOST is set below.
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl git
case "$(uname -m)" in
  x86_64) arch=x86_64 ;;
  aarch64) arch=arm64 ;;
  *) echo "unsupported CPU" >&2; exit 1 ;;
esac
tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/avivsinai/bitbucket-cli/releases/latest)
tag=${tag##*/}
# Downloads go to the disk and are removed again, also when something fails.
work=$(mktemp -d -p /var/tmp)
trap 'rm -rf "$work"' EXIT
cd "$work"
curl -fsSLO "https://github.com/avivsinai/bitbucket-cli/releases/download/$tag/bkt_${tag#v}_linux_${arch}.tar.gz"
curl -fsSL "https://github.com/avivsinai/bitbucket-cli/releases/download/$tag/checksums.txt" | grep "bkt_${tag#v}_linux_${arch}.tar.gz\$" | sha256sum -c -
tar -xzf "bkt_${tag#v}_linux_${arch}.tar.gz"
sudo install -m 0755 "$(find . -name bkt -type f | head -n 1)" /usr/local/bin/bkt
bkt --version
'''

[env]
BKT_HOST = "https://bitbucket.org"
BKT_ALLOW_INSECURE_STORE = "1"

[[credential]]
name = "bitbucket"
label = "Bitbucket access token"
help = "Cloud: an Atlassian API token with Bitbucket scopes (create it with scopes, app Bitbucket) used with your e-mail as User name (basic), or a repository, project or workspace access token (bearer). Data Center: a personal access token (bearer)."
url = "https://id.atlassian.com/manage-profile/security/api-tokens"
hosts = ["bitbucket.org", "api.bitbucket.org"]
env = ["BKT_TOKEN"]

[[config]]
env = "BKT_WORKSPACE"
label = "Workspace"
help = "Default Cloud workspace."

[[config]]
env = "BKT_PROJECT"
label = "Project"
help = "Default Data Center project key."

[[config]]
env = "BKT_REPO"
label = "Repository"
help = "Repository that commands use unless told otherwise."

[[config]]
env = "BKT_USERNAME"
label = "User name"
help = "For basic authentication; with a Cloud API token this is your Atlassian account e-mail."

[[config]]
env = "BKT_AUTH_METHOD"
label = "Authentication"
help = "basic sends user name and token (Cloud default); bearer sends the token alone (Data Center default without a user name, and Cloud access tokens)."
kind = "choice"
options = ["basic", "bearer"]
