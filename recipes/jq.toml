name = "jq"
category = "tool"
description = "Command-line JSON processor"
icon = "jq.svg"
icon_color = "#444444"
os = ["debian", "ubuntu"]
install_allow = ["@packages"]
install = '''
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends jq
jq --version
'''
